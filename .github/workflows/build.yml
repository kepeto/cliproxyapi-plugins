name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goarch: amd64
            goarm: ''
            cross: ''
          - name: linux-arm64
            goarch: arm64
            goarm: ''
            cross: aarch64-linux-gnu-
          - name: linux-arm
            goarch: arm
            goarm: 7
            cross: arm-linux-gnueabihf-

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install cross-compiler
        run: |
          if [ -n "${{ matrix.cross }}" ]; then
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.goarch }}-linux-gnu-gcc
          fi
      - name: Build plugin
        working-directory: plugins/nous-portal
        env:
          CC: ${{ matrix.cross }}gcc
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 1
        run: |
          go build -buildmode=c-shared -o ../../dist/nous-portal-${{ matrix.goarch }}.so .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nous-portal-${{ matrix.name }}
          path: dist/nous-portal-${{ matrix.goarch }}.*
