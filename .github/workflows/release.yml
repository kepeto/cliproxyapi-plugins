name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_notes_file="$(mktemp)"
          generated_notes_file="$(mktemp)"
          changelog_entries_file="$(mktemp)"
          updated_notes_file="$(mktemp)"
          trap 'rm -f "$release_notes_file" "$generated_notes_file" "$changelog_entries_file" "$updated_notes_file"' EXIT

          cat > "$release_notes_file" <<'NOTES'
          <!-- plugin-release-assets:start -->
          ## Release Assets

          - `nous-portal_<version>_<os>_<arch>.zip` — `.so` plugin for Linux/macOS.
          - `nous-portal_<version>_windows_<arch>.zip` — `.dll` plugin for Windows.
          - `nous-portal-free_<version>_<os>_<arch>.zip` — free Nous Portal plugin.
          - `opencode-free_<version>_<os>_<arch>.zip` — OpenCode Zen free plugin.
          - `kilo-free_<version>_<os>_<arch>.zip` — KiloCode free plugin.
          - `registry.json` — plugin store registry.
          <!-- plugin-release-assets:end -->
          NOTES

          git fetch --force --tags
          previous_tag=""
          if previous_tag_value="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null)"; then
            previous_tag="$previous_tag_value"
            changelog_range="${previous_tag}..${GITHUB_REF_NAME}"
          else
            changelog_range="$GITHUB_REF_NAME"
          fi

          git log --reverse --pretty=format:'- %s (%h)' "$changelog_range" |
            grep -Ev '^- (docs:|test:)' > "$changelog_entries_file" || true

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body > "$generated_notes_file" || true
          if [[ ! -s "$generated_notes_file" ]]; then
            if [[ -n "$previous_tag" ]]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_REF_NAME" > "$generated_notes_file"
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > "$generated_notes_file"
            fi
          fi

          {
            cat "$release_notes_file"
            printf '\n'
            if [[ -s "$changelog_entries_file" ]]; then
              printf '## Changelog\n\n'
              cat "$changelog_entries_file"
              printf '\n\n'
            fi
            cat "$generated_notes_file"
          } > "$updated_notes_file"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$updated_notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$updated_notes_file"
          fi

  build:
    name: build ${{ matrix.plugin }} ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: nous-portal
            plugin_dir: plugins/nous-portal
            binary_name: nous-portal
            target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: nous-portal
            plugin_dir: plugins/nous-portal
            binary_name: nous-portal
            target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
          - plugin: nous-portal
            plugin_dir: plugins/nous-portal
            binary_name: nous-portal
            target: linux-arm
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            asset_arch: arm
            archive_format: zip
            cross: gcc-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
          - plugin: nous-portal
            plugin_dir: plugins/nous-portal
            binary_name: nous-portal
            target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: nous-portal
            plugin_dir: plugins/nous-portal
            binary_name: nous-portal
            target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
          - plugin: nous-portal
            plugin_dir: plugins/nous-portal
            binary_name: nous-portal
            target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: linux-arm
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            asset_arch: arm
            archive_format: zip
            cross: gcc-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: linux-arm
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            asset_arch: arm
            archive_format: zip
            cross: gcc-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: linux-arm
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            asset_arch: arm
            archive_format: zip
            cross: gcc-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ matrix.plugin_dir }}/go.sum
      - name: Install cross-compiler
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" != "" ]]; then
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.cross }}
          fi
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build plugin
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
          CC: ${{ matrix.cc }}
          PLUGIN: ${{ matrix.plugin }}
          PLUGIN_DIR: ${{ matrix.plugin_dir }}
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          archive_dir="$workspace/dist/${TARGET}/${PLUGIN}"
          ext=".so"
          if [[ "$GOOS" == "windows" ]]; then
            ext=".dll"
          elif [[ "$GOOS" == "darwin" ]]; then
            ext=".dylib"
          fi
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            archive_name="${BINARY_NAME}_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.zip"
          else
            archive_name="${BINARY_NAME}_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.zip"
          fi
          rm -rf "$archive_dir"
          mkdir -p "$archive_dir"

          cd "$workspace/${PLUGIN_DIR}"
          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" CC="$CC" go build -buildmode=c-shared -o "$archive_dir/${BINARY_NAME}${ext}" .

          cd "$workspace"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            if [[ "$GOOS" == "windows" ]]; then
              powershell -NoProfile -Command "Compress-Archive -Path '${archive_dir}/*' -DestinationPath 'dist/${archive_name}' -Force"
            else
              zip -j "dist/$archive_name" "$archive_dir/${BINARY_NAME}${ext}"
            fi
          else
            tar -C "$archive_dir" -czf "dist/$archive_name" "${BINARY_NAME}${ext}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

  generate-registry:
    name: generate plugin store registry
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$GITHUB_WORKSPACE/dist"
          gh release download "$GITHUB_REF_NAME" --pattern '*.tar.gz' --pattern '*.zip' --clobber
      - name: Generate registry.json
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/registry.json" <<JSON
          {
            "schema_version": 1,
            "plugins": [
              {
                "id": "nous-portal",
                "name": "Nous Portal",
                "description": "OAuth device-code authentication for Nous Portal inference API",
                "author": "kepeto",
                "version": "${RELEASE_VERSION#v}",
                "repository": "https://github.com/kepeto/cliproxyapi-plugins",
                "logo": "https://hermes-agent.nousresearch.com/favicon.ico",
                "homepage": "https://portal.nousresearch.com",
                "license": "MIT",
                "tags": ["nous", "portal", "oauth", "inference"],
                "install": {
                  "type": "github-release",
                  "artifacts": [
                    {
                      "goos": "linux",
                      "goarch": "amd64",
                      "url": "https://github.com/kepeto/cliproxyapi-plugins/releases/download/${RELEASE_VERSION}/nous-portal_${RELEASE_VERSION#v}_linux_amd64.zip",
                      "sha256": "$(sha256sum "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_linux_amd64.zip" 2>/dev/null | cut -d' ' -f1 || echo '')",
                      "size": $(stat -c%s "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_linux_amd64.zip" 2>/dev/null || echo '0')
                    },
                    {
                      "goos": "linux",
                      "goarch": "arm64",
                      "url": "https://github.com/kepeto/cliproxyapi-plugins/releases/download/${RELEASE_VERSION}/nous-portal_${RELEASE_VERSION#v}_linux_arm64.zip",
                      "sha256": "$(sha256sum "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_linux_arm64.zip" 2>/dev/null | cut -d' ' -f1 || echo '')",
                      "size": $(stat -c%s "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_linux_arm64.zip" 2>/dev/null || echo '0')
                    },
                    {
                      "goos": "linux",
                      "goarch": "arm",
                      "url": "https://github.com/kepeto/cliproxyapi-plugins/releases/download/${RELEASE_VERSION}/nous-portal_${RELEASE_VERSION#v}_linux_arm.zip",
                      "sha256": "$(sha256sum "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_linux_arm.zip" 2>/dev/null | cut -d' ' -f1 || echo '')",
                      "size": $(stat -c%s "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_linux_arm.zip" 2>/dev/null || echo '0')
                    },
                    {
                      "goos": "darwin",
                      "goarch": "amd64",
                      "url": "https://github.com/kepeto/cliproxyapi-plugins/releases/download/${RELEASE_VERSION}/nous-portal_${RELEASE_VERSION#v}_darwin_amd64.zip",
                      "sha256": "$(sha256sum "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_darwin_amd64.zip" 2>/dev/null | cut -d' ' -f1 || echo '')",
                      "size": $(stat -c%s "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_darwin_amd64.zip" 2>/dev/null || echo '0')
                    },
                    {
                      "goos": "darwin",
                      "goarch": "arm64",
                      "url": "https://github.com/kepeto/cliproxyapi-plugins/releases/download/${RELEASE_VERSION}/nous-portal_${RELEASE_VERSION#v}_darwin_arm64.zip",
                      "sha256": "$(sha256sum "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_darwin_arm64.zip" 2>/dev/null | cut -d' ' -f1 || echo '')",
                      "size": $(stat -c%s "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_darwin_arm64.zip" 2>/dev/null || echo '0')
                    },
                    {
                      "goos": "windows",
                      "goarch": "amd64",
                      "url": "https://github.com/kepeto/cliproxyapi-plugins/releases/download/${RELEASE_VERSION}/nous-portal_${RELEASE_VERSION#v}_windows_amd64.zip",
                      "sha256": "$(sha256sum "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_windows_amd64.zip" 2>/dev/null | cut -d' ' -f1 || echo '')",
                      "size": $(stat -c%s "$GITHUB_WORKSPACE/dist/nous-portal_${RELEASE_VERSION#v}_windows_amd64.zip" 2>/dev/null || echo '0')
                    }
                  ]
                }
              },
              {
                "id": "nous-portal-free",
                "name": "Nous Portal Free",
                "description": "Nous Portal free models plugin for CLIProxyAPI",
                "author": "kepeto",
                "version": "${RELEASE_VERSION#v}",
                "repository": "https://github.com/kepeto/cliproxyapi-plugins",
                "logo": "https://hermes-agent.nousresearch.com/favicon.ico",
                "homepage": "https://portal.nousresearch.com",
                "license": "MIT",
                "tags": ["nous", "portal", "free", "oauth"],
                "install": {
                  "type": "github-release",
                  "artifacts": [
                    {
                      "goos": "linux",
                      "goarch": "amd64",
                      "url": "https://github.com/kepeto/cliproxyapi-plugins/releases/download/${RELEASE_VERSION}/nous-portal-free_${RELEASE_VERSION#v}_linux_amd64.zip",
                      "sha256": "$(sha256sum "$GITHUB_WORKSPACE/dist/nous-portal-free_${RELEASE_VERSION#v}_linux_amd64.zip" 2>/dev/null | cut -d' ' -f1 || echo '')",
                      "size": $(stat -c%s "$GITHUB_WORKSPACE/dist/nous-portal-free_${RELEASE_VERSION#v}_linux_amd64.zip" 2>/dev/null || echo '0')
                    }
                  ]
                }
              },
              {
                "id": "opencode-free",
                "name": "OpenCode Zen Free",
                "description": "OpenCode Zen free models plugin for CLIProxyAPI",
                "author": "kepeto",
                "version": "${RELEASE_VERSION#v}",
                "repository": "https://github.com/kepeto/cliproxyapi-plugins",
                "logo": "https://opencode.ai/favicon.ico",
                "homepage": "https://opencode.ai",
                "license": "MIT",
                "tags": ["opencode", "free", "zen"],
                "install": {
                  "type": "github-release",
                  "artifacts": [
                    {
                      "goos": "linux",
                      "goarch": "amd64",
                      "url": "https://github.com/kepeto/cliproxyapi-plugins/releases/download/${RELEASE_VERSION}/opencode-free_${RELEASE_VERSION#v}_linux_amd64.zip",
                      "sha256": "$(sha256sum "$GITHUB_WORKSPACE/dist/opencode-free_${RELEASE_VERSION#v}_linux_amd64.zip" 2>/dev/null | cut -d' ' -f1 || echo '')",
                      "size": $(stat -c%s "$GITHUB_WORKSPACE/dist/opencode-free_${RELEASE_VERSION#v}_linux_amd64.zip" 2>/dev/null || echo '0')
                    }
                  ]
                }
              },
              {
                "id": "kilo-free",
                "name": "KiloCode Free",
                "description": "KiloCode free models plugin for CLIProxyAPI",
                "author": "kepeto",
                "version": "${RELEASE_VERSION#v}",
                "repository": "https://github.com/kepeto/cliproxyapi-plugins",
                "logo": "https://kilo.ai/favicon.ico",
                "homepage": "https://kilo.ai",
                "license": "MIT",
                "tags": ["kilo", "free", "kilo-code"],
                "install": {
                  "type": "github-release",
                  "artifacts": [
                    {
                      "goos": "linux",
                      "goarch": "amd64",
                      "url": "https://github.com/kepeto/cliproxyapi-plugins/releases/download/${RELEASE_VERSION}/kilo-free_${RELEASE_VERSION#v}_linux_amd64.zip",
                      "sha256": "$(sha256sum "$GITHUB_WORKSPACE/dist/kilo-free_${RELEASE_VERSION#v}_linux_amd64.zip" 2>/dev/null | cut -d' ' -f1 || echo '')",
                      "size": $(stat -c%s "$GITHUB_WORKSPACE/dist/kilo-free_${RELEASE_VERSION#v}_linux_amd64.zip" 2>/dev/null || echo '0')
                    }
                  ]
                }
              }
            ]
          }
          JSON
      - name: Upload registry to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/registry.json" --clobber
      - name: Commit registry to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          
          git add registry.json
          git commit -m "chore: update plugin store registry to ${RELEASE_VERSION}"
          git push origin main
