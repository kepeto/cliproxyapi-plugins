name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without v, e.g. 0.1.36"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    outputs:
      version: ${{ steps.release-vars.outputs.version }}
      tag: ${{ steps.release-vars.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate release tag
        id: release-vars
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            tag="v${version}"
          else
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?)$ ]]; then
              echo "release tag must be v<semver>, got '$tag'" >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semver '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          # version and tag outputs are the single release contract.

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_notes_file="$(mktemp)"
          generated_notes_file="$(mktemp)"
          changelog_entries_file="$(mktemp)"
          updated_notes_file="$(mktemp)"
          trap 'rm -f "$release_notes_file" "$generated_notes_file" "$changelog_entries_file" "$updated_notes_file"' EXIT

          cat > "$release_notes_file" <<'NOTES'
          <!-- plugin-release-assets:start -->
          ## Release Assets

          - `nous-portal-free_<version>_<os>_<arch>.zip` — free Nous Portal plugin.
          - `opencode-free_<version>_<os>_<arch>.zip` — OpenCode Zen free plugin.
          - `kilo-free_<version>_<os>_<arch>.zip` — KiloCode free plugin.
          - `registry.json` — complete plugin store registry.
          <!-- plugin-release-assets:end -->
          NOTES
          printf '**Full Changelog**: https://github.com/%s/commits/%s\n' "$GITHUB_REPOSITORY" "${{ steps.release-vars.outputs.tag }}" > "$generated_notes_file"

          {
            cat "$release_notes_file"
            printf '\n'
            if [[ -s "$changelog_entries_file" ]]; then
              printf '## Changelog\n\n'
              cat "$changelog_entries_file"
              printf '\n\n'
            fi
            cat "$generated_notes_file"
          } > "$updated_notes_file"

          if gh release view "${{ steps.release-vars.outputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.release-vars.outputs.tag }}" --title "${{ steps.release-vars.outputs.tag }}" --notes-file "$updated_notes_file"
          else
            gh release create "${{ steps.release-vars.outputs.tag }}" --title "${{ steps.release-vars.outputs.tag }}" --notes-file "$updated_notes_file" --draft=false
          fi

  build:
    name: build ${{ matrix.plugin }} ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset_arch: arm64
            archive_format: zip
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: linux-arm
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            asset_arch: arm
            archive_format: zip
            cross: gcc-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: arm64
            archive_format: zip
          - plugin: nous-portal-free
            plugin_dir: plugins/nous-portal-free
            binary_name: nous-portal-free
            target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset_arch: arm64
            archive_format: zip
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: linux-arm
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            asset_arch: arm
            archive_format: zip
            cross: gcc-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: arm64
            archive_format: zip
          - plugin: opencode-free
            plugin_dir: plugins/opencode-free
            binary_name: opencode-free
            target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset_arch: arm64
            archive_format: zip
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: linux-arm
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            asset_arch: arm
            archive_format: zip
            cross: gcc-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: arm64
            archive_format: zip
          - plugin: kilo-free
            plugin_dir: plugins/kilo-free
            binary_name: kilo-free
            target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: ${{ matrix.plugin_dir }}/go.sum
      - name: Install cross-compiler
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" != "" ]]; then
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.cross }}
          fi
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${{ needs.prepare-release.outputs.version }}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build plugin
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
          CC: ${{ matrix.cc }}
          PLUGIN: ${{ matrix.plugin }}
          PLUGIN_DIR: ${{ matrix.plugin_dir }}
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          archive_dir="$workspace/dist/${TARGET}/${PLUGIN}"
          ext=".so"
          if [[ "$GOOS" == "windows" ]]; then
            ext=".dll"
          elif [[ "$GOOS" == "darwin" ]]; then
            ext=".dylib"
          fi
          archive_name="${BINARY_NAME}_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.zip"
          rm -rf "$archive_dir"
          mkdir -p "$archive_dir"

          cd "$workspace/${PLUGIN_DIR}"
          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" CC="$CC" go build -ldflags "-X main.pluginVersion=${RELEASE_VERSION}" -buildmode=c-shared -o "$archive_dir/${BINARY_NAME}${ext}" .

          cd "$workspace"
          zip -j "dist/$archive_name" "$archive_dir/${BINARY_NAME}${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            exit 1
          fi
          gh release upload "${{ needs.prepare-release.outputs.tag }}" "${assets[@]}" --clobber

  generate-registry:
    name: generate plugin store registry
    needs: [prepare-release, build]
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download complete release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          gh release download "$RELEASE_TAG" --pattern '*_*.zip' --dir "$GITHUB_WORKSPACE/dist" --clobber
      - name: Generate registry.json
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_registry.py \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --dist "$GITHUB_WORKSPACE/dist" \
            --output "$GITHUB_WORKSPACE/registry.json"
      - name: Generate checksums.txt
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum *.zip | sort > checksums.txt
      - name: Upload checksums.txt to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/dist/checksums.txt" --clobber
      - name: Upload registry to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/registry.json" --clobber
      - name: Commit registry to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/registry.json" "$RUNNER_TEMP/registry.json"
          git fetch origin main
          git checkout -B release-registry-main refs/remotes/origin/main
          git pull --ff-only origin main
          mv "$RUNNER_TEMP/registry.json" "$GITHUB_WORKSPACE/registry.json"
          git add registry.json
          if git diff --cached --quiet -- registry.json; then
            echo "registry.json is already current"
            exit 0
          fi
          git commit -m "chore: update plugin registry"
          git push origin HEAD:refs/heads/main
